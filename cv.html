<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV | Tuffy Licciardi Issa</title>
  <meta name="description" content="Curriculum Vitae of Tuffy Licciardi Issa." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f3;
      --paper: #ffffff;
      --text: #1d1d1b;
      --muted: #5e5a55;
      --line: rgba(221, 216, 207, 0.8);
      --accent: #19335a;
      --accent-soft: #e9eef6;
      --max-width: 1040px;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(247, 246, 243, 0.9);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
    }

    .brand {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 1rem;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      grid-column: 2;
    }

    .nav a {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav a:hover {
      color: var(--accent);
      text-decoration: none;
    }

    .language-switch {
      grid-column: 3;
      justify-self: end;
      padding: 5px 9px;
      border: 1px solid rgba(25, 51, 90, 0.32);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .language-switch:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      text-decoration: none;
    }

    .section {
      padding: 34px 0 40px;
    }

    .section-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 1.65rem;
      margin: 0 0 14px;
    }

    .viewer-shell {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.94rem;
      flex-wrap: wrap;
    }

    .pdf-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 190px);
      min-height: 620px;
      border: 0;
      background: var(--paper);
    }

    @media (max-width: 640px) {
      .topbar-inner {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .nav {
        grid-column: 1;
        justify-content: flex-start;
        gap: 10px;
      }

      .nav a {
        font-size: 0.86rem;
      }

      .language-switch {
        grid-column: 2;
      }

      .pdf-frame {
        height: calc(100vh - 230px);
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <nav class="nav">
        <a href="index.html#interests">Interests</a>
        <a href="index.html#research">Research</a>
        <a href="index.html#teaching">Teaching</a>
        <a href="index.html#cv">CV</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <a class="language-switch" href="cv.html?lang=pt-BR" lang="pt-BR" hreflang="pt-BR" aria-label="Ver esta p&aacute;gina em portugu&ecirc;s">PT-BR</a>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section-title">Curriculum Vitae</h1>
      <div class="viewer-shell">
        <div class="viewer-toolbar">
          <span>Tuffy Licciardi Issa CV</span>
          <a href="Tuffy_Licciardi_Issa_CV.pdf" target="_blank" rel="noopener noreferrer">Open PDF in new tab</a>
        </div>
        <iframe class="pdf-frame" src="Tuffy_Licciardi_Issa_CV.pdf" title="Tuffy Licciardi Issa CV"></iframe>
      </div>
    </div>
  </main>
  <script>
    const pageParams = new URLSearchParams(window.location.search);
    const portugueseActive = (pageParams.get("lang") || "").toLowerCase() === "pt-br";
    const languageSwitch = document.querySelector(".language-switch");

    if (portugueseActive) {
      document.documentElement.lang = "pt-BR";
      document.title = "Curriculum Vitae | Tuffy Licciardi Issa";

      if (languageSwitch) {
        languageSwitch.textContent = "EN";
        languageSwitch.href = "cv.html";
        languageSwitch.lang = "en";
        languageSwitch.hreflang = "en";
        languageSwitch.setAttribute("aria-label", "View this page in English");
      }

      const navLabels = ["Interesses", "Pesquisa", "Ensino", "CV", "Contato"];
      const navAnchors = ["interests", "research", "teaching", "cv", "contact"];
      document.querySelectorAll(".nav a").forEach((link, index) => {
        link.textContent = navLabels[index];
        link.href = "index.html?lang=pt-BR#" + navAnchors[index];
      });

      const toolbarTitle = document.querySelector(".viewer-toolbar span");
      const pdfLink = document.querySelector(".viewer-toolbar a");
      if (toolbarTitle) {
        toolbarTitle.textContent = "CV de Tuffy Licciardi Issa";
      }
      if (pdfLink) {
        pdfLink.textContent = "Abrir PDF em nova aba";
      }
    }
  </script>
</body>
</html>
